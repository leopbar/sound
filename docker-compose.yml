# Local:   docker compose up -d --build            -> http://localhost:8080
# VPS:     DOMAIN=sound.seudominio.com no .env e
#          docker compose --profile https up -d --build  -> https://sound.seudominio.com
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sound
      POSTGRES_DB: sound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sound -d sound"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      DATABASE_URL: postgres://sound:${POSTGRES_PASSWORD}@db:5432/sound
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${APP_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina BETTER_AUTH_SECRET no .env (openssl rand -base64 32)}
    expose:
      - "4000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Com o Caddy na frente, use CLIENT_BIND=127.0.0.1 para não expor a porta HTTP direto.
      - "${CLIENT_BIND:-0.0.0.0}:${CLIENT_PORT:-8080}:80"

  # HTTPS automático (Let's Encrypt). Necessário em produção: cookies Secure e passkeys exigem HTTPS.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - client
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
