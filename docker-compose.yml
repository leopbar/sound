# Produção: http://localhost:${CLIENT_PORT:-8080}  (ex.: CLIENT_PORT=8088 docker compose up -d)
services:
  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    expose:
      - "4000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-8080}:80"
