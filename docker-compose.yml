# Local:   docker compose up -d --build            -> http://localhost:8080
# VPS:     DOMAIN=sound.seudominio.com no .env e
#          docker compose --profile https up -d --build  -> https://sound.seudominio.com
# Subcaminho atrás de um nginx já existente: APP_URL=https://seudominio.com/sound,
#          BASE_PATH=/sound, CLIENT_BIND=127.0.0.1, sem o perfil https (ver README).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sound
      POSTGRES_DB: sound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sound -d sound"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      libretranslate:
        # A inicialização do player não espera o carregamento dos modelos de tradução.
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      DATABASE_URL: postgres://sound:${POSTGRES_PASSWORD}@db:5432/sound
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${APP_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina BETTER_AUTH_SECRET no .env (openssl rand -base64 32)}
    expose:
      - "4000"
    volumes:
      # Cookies do YouTube para o yt-dlp (YTDLP_COOKIES_FILE=/secrets/youtube-cookies.txt no .env).
      # Gravável: o yt-dlp atualiza os cookies que o YouTube renova. Fora do git.
      - ./secrets:/secrets

  libretranslate:
    image: libretranslate/libretranslate@sha256:cf85439147da3cf73fb525a303cfeb884946a9bc633083143bd771d6c6efb007
    restart: unless-stopped
    # Apenas rede Docker; a API pública continua exigindo login no Sound.
    expose:
      - "5000"
    environment:
      LT_LOAD_ONLY: en,es,fr,de,it,pt,pb
      LT_DISABLE_WEB_UI: "true"
      LT_THREADS: "2"
      LT_BATCH_LIMIT: "50"
      LT_CHAR_LIMIT: "4000"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
    cpus: 1.5
    # Menor prioridade de CPU que o player e os demais serviços quando há disputa.
    cpu_shares: 256
    mem_limit: 2g
    volumes:
      - translation_models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD", "./venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 15m
      retries: 5

  client:
    build:
      context: ./client
      args:
        # Subcaminho do app (ex.: /sound). Tem que bater com o caminho do APP_URL.
        BASE_PATH: ${BASE_PATH:-}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # Com o Caddy na frente, use CLIENT_BIND=127.0.0.1 para não expor a porta HTTP direto.
      - "${CLIENT_BIND:-0.0.0.0}:${CLIENT_PORT:-8080}:80"

  # HTTPS automático (Let's Encrypt). Necessário em produção: cookies Secure e passkeys exigem HTTPS.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - client
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  translation_models:
  pgdata:
  caddy_data:
  caddy_config:
