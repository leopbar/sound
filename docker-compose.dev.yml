# Desenvolvimento com hot reload: http://localhost:5173
#   docker compose -f docker-compose.dev.yml up
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sound
      POSTGRES_PASSWORD: sound
      POSTGRES_DB: sound
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sound -d sound"]
      interval: 3s
      retries: 20

  server:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      CORS_ORIGINS: http://localhost:5173
      APP_URL: http://localhost:5173
      DATABASE_URL: postgres://sound:sound@db:5432/sound
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_modules:/app/node_modules
    ports:
      - "4000:4000"

  client:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_PROXY: http://server:4000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./client:/app
      - client_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata_dev:
  server_modules:
  client_modules:
